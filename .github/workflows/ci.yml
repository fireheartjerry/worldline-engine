name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "claude/**"
  pull_request:

jobs:
  # NOTE: CI is intentionally scoped to Windows for now. The seeded universe /
  # N-body sandbox is not yet bit-reproducible across compilers (the seed->genome
  # pipeline still calls platform libm), so the tier verification diverges on
  # Linux/GCC and macOS/Clang. Until that determinism work lands, Windows is the
  # single reference platform; the Linux and macOS jobs were removed deliberately,
  # not lost.
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Debug
        run: cmake --build build --config Debug

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Package Release
        run: cmake --build build --config Release --target package
